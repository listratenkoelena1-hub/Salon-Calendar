<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Salon Calendar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
font-family: Arial, sans-serif;
margin: 10px;
}

h2 {
margin-bottom: 10px;
}

.top-bar {
display: flex;
gap: 10px;
align-items: center;
margin-bottom: 10px;
}

button {
padding: 8px 12px;
font-size: 14px;
cursor: pointer;
}

table {
border-collapse: collapse;
width: 100%;
}

th, td {
border: 1px solid #ccc;
padding: 4px;
text-align: center;
font-size: 12px;
height: 26px;
}

th {
background: #f0f0f0;
position: sticky;
top: 0;
z-index: 2;
}

td.time {
background: #fafafa;
font-weight: bold;
width: 70px;
}

.slot {
cursor: pointer;
}

.appointment {
font-size: 11px;
color: #000;
border-radius: 4px;
}

/* Модальное окно */
.modal {
display: none;
position: fixed;
inset: 0;
background: rgba(0,0,0,0.4);
justify-content: center;
align-items: center;
z-index: 10;
}

.modal-content {
background: #fff;
padding: 15px;
width: 300px;
border-radius: 6px;
}

.modal-content label {
display: block;
margin-top: 8px;
font-size: 13px;
}

.modal-content input,
.modal-content select,
.modal-content textarea {
width: 100%;
padding: 5px;
margin-top: 3px;
}

.modal-actions {
margin-top: 10px;
display: flex;
justify-content: space-between;
}
</style>
</head>

<body>

<h2>Salon Calendar</h2>

<div class="top-bar">
<input type="date" id="currentDate">
<button onclick="openAddModal()">Add appointment</button>
</div>

<table id="calendar">
<thead>
<tr>
<th>Time</th>
<th>Staff 1</th>
<th>Staff 2</th>
<th>Staff 3</th>
<th>Staff 4</th>
<th>Staff 5</th>
<th>Staff 6</th>
<th>Staff 7</th>
<th>Staff 8</th>
<th>Staff 9</th>
<th>Anyone</th>
</tr>
</thead>
<tbody id="calendarBody"></tbody>
</table>

<!-- ADD APPOINTMENT MODAL -->
<div class="modal" id="addModal">
<div class="modal-content">
<h3>Add appointment</h3>

<label>Date</label>
<input type="date" id="apptDate" readonly>

<label>Staff</label>
<select id="apptStaff">
<option>Staff 1</option>
<option>Staff 2</option>
<option>Staff 3</option>
<option>Staff 4</option>
<option>Staff 5</option>
<option>Staff 6</option>
<option>Staff 7</option>
<option>Staff 8</option>
<option>Staff 9</option>
<option>Anyone</option>
</select>

<label>Start time</label>
<select id="apptTime"></select>

<label>Duration</label>
<select id="apptDuration">
<option value="15">15 min</option>
<option value="30">30 min</option>
<option value="45">45 min</option>
<option value="60">1:00</option>
<option value="75">1:15</option>
<option value="90">1:30</option>
<option value="105">1:45</option>
<option value="120">2:00</option>
<option value="150">2:30</option>
<option value="180">3:00</option>
<option value="210">3:30</option>
</select>

<label>Client</label>
<input id="apptClient">

<label>Notes</label>
<textarea id="apptNotes"></textarea>

<div class="modal-actions">
<button onclick="saveAppointment()">Save</button>
<button onclick="closeAddModal()">Cancel</button>
</div>
</div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyC5BecKxYxQ9V5qbmXBNkTsvnIZBtK_dx8",
authDomain: "rosesnails-calendar.firebaseapp.com",
projectId: "rosesnails-calendar",
storageBucket: "rosesnails-calendar.firebasestorage.app",
messagingSenderId: "1000239390265",
appId: "1:1000239390265:web:d2ed45be53b233cf40f7e8"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const calendarBody = document.getElementById('calendarBody');
const timeSelect = document.getElementById('apptTime');
const currentDate = document.getElementById('currentDate');

function buildTimes() {
calendarBody.innerHTML = '';
timeSelect.innerHTML = '';

for (let h = 8; h <= 20; h++) {
for (let m = 0; m < 60; m += 15) {
if (h === 20 && m > 0) continue;

let time24 = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');

let h12 = h % 12 || 12;
let ampm = h < 12 ? 'AM' : 'PM';
let label = h12 + ':' + String(m).padStart(2,'0') + ' ' + ampm;

timeSelect.innerHTML += `<option value="${time24}">${label}</option>`;

let tr = document.createElement('tr');
tr.innerHTML = `<td class="time">${label}</td>` +
'<td class="slot"></td>'.repeat(10);
calendarBody.appendChild(tr);
}
}
}

function openAddModal() {
document.getElementById('addModal').style.display = 'flex';
document.getElementById('apptDate').value = currentDate.value;
}

function closeAddModal() {
document.getElementById('addModal').style.display = 'none';
}

async function saveAppointment() {
await addDoc(collection(db, "appointments"), {
date: document.getElementById('apptDate').value,
staff: document.getElementById('apptStaff').value,
time: document.getElementById('apptTime').value,
duration: document.getElementById('apptDuration').value,
client: document.getElementById('apptClient').value,
notes: document.getElementById('apptNotes').value,
createdAt: Date.now()
});
closeAddModal();
alert("Saved");
}

currentDate.valueAsDate = new Date();
buildTimes();
</script>

</body>
</html>
