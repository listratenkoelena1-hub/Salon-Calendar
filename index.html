<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Salon Calendar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial, sans-serif; margin: 10px; }
header { display:flex; gap:12px; margin-bottom:15px; flex-wrap:wrap; }
header input, header button { font-size:16px; padding:8px 12px; }

table { border-collapse:collapse; width:100%; table-layout:fixed; }
th, td { border:1px solid #ccc; height:32px; font-size:12px; text-align:center; }
th { background:#f5f5f5; }
.time { width:75px; background:#fafafa; }
.slot { cursor:pointer; }

.modal {
position:fixed; inset:0;
background:rgba(0,0,0,.4);
display:flex; align-items:center; justify-content:center;
z-index:1000;
}
.hidden { display:none; }
.modal-content {
background:#fff; padding:15px; border-radius:12px;
width:380px; max-height:90vh; overflow:auto;
}
.modal-content h3 { margin-top:0; }
.modal-content label { font-size:12px; display:block; margin-top:8px; }
.modal-content input, select, textarea { width:100%; }
textarea { resize:none; }

.staff-card {
display:flex;
align-items:center;
gap:8px;
padding:8px;
border:1px solid #ddd;
border-radius:8px;
margin-bottom:8px;
}
.staff-name { flex:1; font-weight:600; }
.staff-card button { font-size:12px; }

.staff-actions {
display:flex;
gap:4px;
}
</style>
</head>

<body>

<header>
<input type="date" id="calendarDate">
<button onclick="openAdd()">Add appointment</button>
<button onclick="openSearch()">Search</button>
<button onclick="openStaff()">Staff</button>
</header>

<table id="calendar"></table>

<!-- APPOINTMENT, SEARCH, DELETE, CONFLICT MODALS -->
<!-- (без изменений, оставлены как есть) -->

<!-- STAFF -->
<div id="staffModal" class="modal hidden">
<div class="modal-content">
<h3>Staff</h3>

<div id="staffList"></div>

<hr>

<label>Add new staff</label>
<input id="newStaffName" placeholder="Name">
<input type="color" id="newStaffColor" value="#cce5ff">
<button onclick="addStaff()">Add</button>

<br><br>
<button onclick="closeStaff()">Close</button>
</div>
</div>

<!-- CONFIRM STAFF DELETE -->
<div id="staffDeleteModal" class="modal hidden">
<div class="modal-content">
<p><b>Delete staff member?</b></p>
<p>All appointments for this staff will also be removed.</p>
<button onclick="confirmStaffDelete()">Yes, delete</button>
<button onclick="cancelStaffDelete()">Cancel</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
getFirestore, collection, addDoc, updateDoc, deleteDoc,
doc, onSnapshot, query, where, getDocs
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

initializeApp({
apiKey:"AIzaSyC5BecKxYxQ9V5qbmXBNkTsvnIZBtK_dx8",
authDomain:"rosesnails-calendar.firebaseapp.com",
projectId:"rosesnails-calendar"
});

const db = getFirestore();

let staff = [];
let appointments = [];
let staffToDelete = null;

/* === STAFF SYNC === */
onSnapshot(collection(db,"staff"), s=>{
staff = s.docs
.map(d=>({id:d.id,...d.data()}))
.sort((a,b)=>a.order-b.order);
renderStaff();
renderCalendar();
});

/* === STAFF UI === */
window.openStaff=()=>staffModal.classList.remove('hidden');
window.closeStaff=()=>staffModal.classList.add('hidden');

function renderStaff(){
staffList.innerHTML='';
staff.forEach((s,i)=>{
staffList.innerHTML+=`
<div class="staff-card">
<span class="staff-name">${s.name}</span>
<input type="color" value="${s.color}"
onchange="updateStaffColor('${s.id}',this.value)">
<div class="staff-actions">
<button onclick="moveStaff(${i},-1)">↑</button>
<button onclick="moveStaff(${i},1)">↓</button>
<button onclick="askStaffDelete('${s.id}')">✕</button>
</div>
</div>`;
});
}

window.addStaff=async()=>{
if(!newStaffName.value.trim()) return;
await addDoc(collection(db,"staff"),{
name:newStaffName.value.trim(),
color:newStaffColor.value,
order: staff.length
});
newStaffName.value='';
};

window.updateStaffColor=(id,color)=>
updateDoc(doc(db,"staff",id),{color});

window.moveStaff=async(i,dir)=>{
const j=i+dir;
if(j<0||j>=staff.length) return;

const a=staff[i], b=staff[j];
await Promise.all([
updateDoc(doc(db,"staff",a.id),{order:b.order}),
updateDoc(doc(db,"staff",b.id),{order:a.order})
]);
};

window.askStaffDelete=id=>{
staffToDelete=id;
staffDeleteModal.classList.remove('hidden');
};

window.cancelStaffDelete=()=>{
staffToDelete=null;
staffDeleteModal.classList.add('hidden');
};

window.confirmStaffDelete=async()=>{
const staffId=staffToDelete;
staffDeleteModal.classList.add('hidden');

const q=query(collection(db,"appointments"),where("staffId","==",staffId));
const snap=await getDocs(q);
await Promise.all(snap.docs.map(d=>deleteDoc(d.ref)));

await deleteDoc(doc(db,"staff",staffId));
staffToDelete=null;
};
</script>

</body>
</html>
