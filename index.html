<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Salon Schedule</title>

<style>
body {
font-family: Arial, sans-serif;
margin: 0;
padding: 10px;
}

header {
display: flex;
gap: 10px;
margin-bottom: 10px;
}

button {
padding: 8px 12px;
cursor: pointer;
}

table {
border-collapse: collapse;
width: 100%;
}

th, td {
border: 1px solid #ccc;
text-align: center;
font-size: 12px;
padding: 4px;
}

th {
background: #f2f2f2;
position: sticky;
top: 0;
}

.time {
width: 70px;
background: #fafafa;
font-weight: bold;
}

.appointment {
color: #000;
font-size: 11px;
padding: 4px;
}

.modal {
display: none;
position: fixed;
inset: 0;
background: rgba(0,0,0,0.4);
align-items: center;
justify-content: center;
}

.modal-content {
background: #fff;
padding: 15px;
width: 300px;
max-height: 90vh;
overflow-y: auto;
}

.staff-row {
display: flex;
gap: 5px;
margin-bottom: 5px;
}

.staff-row input {
flex: 1;
}
</style>
</head>

<body>

<header>
<button onclick="openAppointment()">Add appointment</button>
<button onclick="openStaff()">Staff</button>
</header>

<table id="calendar">
<thead>
<tr>
<th>Time</th>
</tr>
</thead>
<tbody></tbody>
</table>

<!-- ADD APPOINTMENT -->
<div class="modal" id="appointmentModal">
<div class="modal-content">
<h3>Add appointment</h3>

<label>Date</label>
<input type="date" id="appDate"><br><br>

<label>Start time</label>
<select id="appTime"></select><br><br>

<label>Staff</label>
<select id="appStaff"></select><br><br>

<label>Duration</label>
<select id="appDuration">
<option value="15">15 min</option>
<option value="30">30 min</option>
<option value="45">45 min</option>
<option value="60">1:00</option>
<option value="75">1:15</option>
<option value="90">1:30</option>
<option value="105">1:45</option>
<option value="120">2:00</option>
<option value="150">2:30</option>
<option value="180">3:00</option>
<option value="195">3:15</option>
</select><br><br>

<label>Client</label>
<input type="text" id="appClient"><br><br>

<label>Note</label>
<input type="text" id="appNote"><br><br>

<button onclick="saveAppointment()">Save</button>
<button onclick="closeModals()">Cancel</button>
</div>
</div>

<!-- STAFF -->
<div class="modal" id="staffModal">
<div class="modal-content">
<h3>Staff</h3>
<div id="staffList"></div>

<hr>

<input id="newStaffName" placeholder="Name">
<input type="color" id="newStaffColor" value="#E6F0FF">
<button onclick="addStaff()">Add staff</button>

<br><br>
<button onclick="closeModals()">Close</button>
</div>
</div>

<script>
const TIMES = [];
for (let h = 8; h < 20; h++) {
for (let m = 0; m < 60; m += 15) {
TIMES.push(formatTime(h, m));
}
}
TIMES.push("08:00 PM");

let staff = JSON.parse(localStorage.getItem("staff")) || [
{id:1,name:"Anna",color:"#FFE4CC"},
{id:2,name:"Maria",color:"#E6F0FF"}
];

let appointments = JSON.parse(localStorage.getItem("appointments")) || [];

function formatTime(h,m){
const ampm = h >= 12 ? "PM" : "AM";
const hh = h % 12 || 12;
return `${String(hh).padStart(2,"0")}:${String(m).padStart(2,"0")} ${ampm}`;
}

function buildCalendar(){
const head = document.querySelector("#calendar thead tr");
head.innerHTML = "<th>Time</th>";
staff.forEach(s=>{
const th=document.createElement("th");
th.textContent=s.name;
head.appendChild(th);
});

const body=document.querySelector("#calendar tbody");
body.innerHTML="";
TIMES.forEach(time=>{
const tr=document.createElement("tr");
tr.innerHTML=`<td class="time">${time}</td>`;
staff.forEach(()=>tr.innerHTML+="<td></td>");
body.appendChild(tr);
});

renderAppointments();
}

function openAppointment(){
document.getElementById("appointmentModal").style.display="flex";
document.getElementById("appTime").innerHTML=TIMES.map(t=>`<option>${t}</option>`).join("");
document.getElementById("appStaff").innerHTML=staff.map(s=>`<option value="${s.id}">${s.name}</option>`).join("");
}

function openStaff(){
document.getElementById("staffModal").style.display="flex";
renderStaff();
}

function closeModals(){
document.querySelectorAll(".modal").forEach(m=>m.style.display="none");
}

function saveAppointment(){
const data={
date:appDate.value,
time:appTime.value,
staff:+appStaff.value,
duration:+appDuration.value,
client:appClient.value,
note:appNote.value
};

const conflict = appointments.find(a =>
a.date===data.date &&
a.staff===data.staff &&
overlap(a,data)
);

if(conflict){
alert("Conflict: time overlap");
return;
}

appointments.push(data);
localStorage.setItem("appointments",JSON.stringify(appointments));
closeModals();
renderAppointments();
}

function overlap(a,b){
const t=x=>parseInt(x.time.split(":")[0])*60+parseInt(x.time.split(":")[1]);
return t(b)<t(a)+a.duration && t(a)<t(b)+b.duration;
}

function renderAppointments(){
document.querySelectorAll(".appointment").forEach(a=>a.remove());
appointments.forEach(a=>{
const col=staff.findIndex(s=>s.id===a.staff)+1;
const row=TIMES.indexOf(a.time);
if(row<0||col<1)return;
const cell=document.querySelector("#calendar tbody").rows[row].cells[col];
const div=document.createElement("div");
div.className="appointment";
div.style.background=staff.find(s=>s.id===a.staff).color;
div.style.height=(a.duration/15*28)+"px";
div.innerHTML=`<b>${a.client}</b><br>${a.note||""}`;
cell.appendChild(div);
});
}

function renderStaff(){
staffList.innerHTML="";
staff.forEach(s=>{
const row=document.createElement("div");
row.className="staff-row";
row.innerHTML=`
<input value="${s.name}" onchange="s.name=this.value;saveStaff()">
<input type="color" value="${s.color}" onchange="s.color=this.value;saveStaff()">
<button onclick="removeStaff(${s.id})">✕</button>`;
staffList.appendChild(row);
});
}

function addStaff(){
staff.push({id:Date.now(),name:newStaffName.value,color:newStaffColor.value});
saveStaff();
}

function removeStaff(id){
staff=staff.filter(s=>s.id!==id);
saveStaff();
}

function saveStaff(){
localStorage.setItem("staff",JSON.stringify(staff));
buildCalendar();
renderStaff();
}

buildCalendar();
</script>

</body>
</html>
