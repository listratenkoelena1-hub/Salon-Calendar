<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Salon Calendar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial, sans-serif; margin: 10px; }
header { display:flex; gap:12px; margin-bottom:15px; flex-wrap:wrap; }
header input, header button { font-size:16px; padding:8px 12px; }

table { border-collapse:collapse; width:100%; table-layout:fixed; }
th, td { border:1px solid #ccc; height:32px; font-size:12px; text-align:center; }
th { background:#f5f5f5; }
.time { width:75px; background:#fafafa; }
.slot { cursor:pointer; }

.modal {
position:fixed; inset:0;
background:rgba(0,0,0,.4);
display:flex; align-items:center; justify-content:center;
z-index:1000;
}
.hidden { display:none; }
.modal-content {
background:#fff; padding:15px; border-radius:10px; width:360px;
max-height:90vh; overflow:auto;
}
.modal-content label { display:block; margin-top:8px; font-size:12px; }
.modal-content input, select, textarea { width:100%; }
textarea { resize:none; }

.staff-row {
display:flex; gap:5px; align-items:center; margin-bottom:6px;
}
.staff-row input[type="color"] { width:40px; padding:0; }
.staff-row button { font-size:12px; }

.search-item {
border-bottom:1px solid #ddd;
padding:6px 0;
cursor:pointer;
}
.search-item:hover { background:#f5f5f5; }
.search-date { font-size:11px; color:#666; }
</style>
</head>

<body>

<header>
<input type="date" id="calendarDate">
<button onclick="openAdd()">Add appointment</button>
<button onclick="openSearch()">Search</button>
<button onclick="openStaff()">Staff</button>
</header>

<table id="calendar"></table>

<!-- APPOINTMENT -->
<div id="appointmentModal" class="modal hidden">
<div class="modal-content">
<h3>Appointment</h3>

<label>Date</label>
<input id="aDate" type="date" readonly disabled>

<label>Staff</label>
<select id="aStaff"></select>

<label>Start time</label>
<select id="aTime"></select>

<label>Duration</label>
<select id="aDuration">
<option value="1">15 min</option>
<option value="2">30 min</option>
<option value="4">1:00</option>
<option value="6">1:30</option>
<option value="8">2:00</option>
</select>

<label>Client</label>
<input id="aClient">

<label>Note</label>
<textarea id="aNote"></textarea>

<br>
<button onclick="saveAppointment()">Save</button>
<button onclick="confirmDelete()">Delete</button>
<button onclick="closeAppointment()">Close</button>
</div>
</div>

<!-- SEARCH -->
<div id="searchModal" class="modal hidden">
<div class="modal-content">
<h3>Search client</h3>
<input id="searchInput" placeholder="Client name" oninput="runSearch()">
<div id="searchResults"></div>
<br>
<button onclick="closeSearch()">Close</button>
</div>
</div>

<!-- STAFF -->
<div id="staffModal" class="modal hidden">
<div class="modal-content">
<h3>Staff</h3>
<div id="staffList"></div>
<hr>
<input id="newStaffName" placeholder="Name">
<input type="color" id="newStaffColor" value="#cce5ff">
<button onclick="addStaff()">Add</button>
<br><br>
<button onclick="closeStaff()">Close</button>
</div>
</div>

<!-- DELETE -->
<div id="deleteModal" class="modal hidden">
<div class="modal-content">
<p>Delete this appointment?</p>
<button onclick="deleteAppointment()">Yes</button>
<button onclick="closeDelete()">No</button>
</div>
</div>

<!-- CONFLICT -->
<div id="conflictModal" class="modal hidden">
<div class="modal-content">
<p>⚠️ Time conflict</p>
<button onclick="closeConflict()">OK</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

initializeApp({
apiKey:"AIzaSyC5BecKxYxQ9V5qbmXBNkTsvnIZBtK_dx8",
authDomain:"rosesnails-calendar.firebaseapp.com",
projectId:"rosesnails-calendar"
});

const db = getFirestore();

let staff = [];
let appointments = [];
let editId = null;

const calendar = document.getElementById('calendar');
const calendarDate = document.getElementById('calendarDate');
calendarDate.valueAsDate = new Date();
calendarDate.onchange = renderCalendar;

const SLOTS = 49;

function timeLabel(i){
const t = 8*60 + i*15;
let h = Math.floor(t/60), m=t%60;
let am=h>=12?'PM':'AM';
h=h%12||12;
return `${h}:${String(m).padStart(2,'0')} ${am}`;
}

onSnapshot(collection(db,"staff"), s=>{
staff = s.docs.map(d=>({id:d.id,...d.data()}));
renderCalendar();
renderStaff();
});

onSnapshot(collection(db,"appointments"), s=>{
appointments = s.docs.map(d=>({id:d.id,...d.data()}));
renderCalendar();
});

function renderCalendar(){
calendar.innerHTML='';
let h='<tr><th class="time">Time</th>';
staff.forEach(s=>h+=`<th>${s.name}</th>`);
h+='</tr>';
calendar.innerHTML+=h;

for(let i=0;i<SLOTS;i++){
let r=`<tr><td class="time">${timeLabel(i)}</td>`;
staff.forEach((_,s)=>r+=`<td class="slot" data-slot="${i}" data-staff="${s}"></td>`);
r+='</tr>';
calendar.innerHTML+=r;
}

drawAppointments();
}

function drawAppointments(){
document.querySelectorAll('.slot').forEach(c=>{
c.innerHTML=''; c.style.background=''; c.onclick=null;
});

appointments.filter(a=>a.date===calendarDate.value).forEach(a=>{
const si = staff.findIndex(s=>s.id===a.staffId);
for(let i=0;i<a.duration;i++){
const cell=document.querySelector(`.slot[data-slot="${a.start+i}"][data-staff="${si}"]`);
if(cell){
cell.style.background=staff[si].color;
if(i===0) cell.innerHTML=a.client;
cell.onclick=()=>openEdit(a.id);
}
}
});
}

window.openAdd=()=>{
editId=null;
appointmentModal.classList.remove('hidden');
aDate.value=calendarDate.value;
fillSelects();
aClient.value='';
aNote.value='';
};

window.openEdit=id=>{
const a=appointments.find(x=>x.id===id);
editId=id;
appointmentModal.classList.remove('hidden');
fillSelects();
aDate.value=a.date;
aStaff.value=staff.findIndex(s=>s.id===a.staffId);
aTime.value=a.start;
aDuration.value=a.duration;
aClient.value=a.client;
aNote.value=a.note||'';
};

function fillSelects(){
aStaff.innerHTML=staff.map((s,i)=>`<option value="${i}">${s.name}</option>`).join('');
aTime.innerHTML=[...Array(SLOTS).keys()]
.map(i=>`<option value="${i}">${timeLabel(i)}</option>`).join('');
}

window.saveAppointment=async()=>{
const data={
date:calendarDate.value,
staffId:staff[aStaff.value].id,
start:+aTime.value,
duration:+aDuration.value,
client:aClient.value,
note:aNote.value
};

const conflict=appointments.some(a=>{
if(a.id===editId) return false;
if(a.date!==data.date||a.staffId!==data.staffId) return false;
return Math.max(a.start,data.start)<Math.min(a.start+a.duration,data.start+data.duration);
});

if(conflict){ conflictModal.classList.remove('hidden'); return; }

editId
? await updateDoc(doc(db,"appointments",editId),data)
: await addDoc(collection(db,"appointments"),data);

closeAppointment();
};

window.confirmDelete=()=>{ if(editId) deleteModal.classList.remove('hidden'); };
window.deleteAppointment=async()=>{
await deleteDoc(doc(db,"appointments",editId));
editId=null;
closeDelete();
closeAppointment();
};

window.openSearch=()=>{
searchInput.value='';
searchResults.innerHTML='';
searchModal.classList.remove('hidden');
};

window.runSearch=()=>{
const q=searchInput.value.toLowerCase();
searchResults.innerHTML='';
if(!q) return;

appointments
.filter(a=>a.client && a.client.toLowerCase().includes(q))
.sort((a,b)=>a.date<b.date?1:-1)
.forEach(a=>{
const s=staff.find(x=>x.id===a.staffId);
searchResults.innerHTML+=`
<div class="search-item" onclick="openFromSearch('${a.id}')">
<div><b>${a.client}</b></div>
<div class="search-date">${a.date} — ${timeLabel(a.start)} — ${s?.name||''}</div>
</div>`;
});
};

window.openFromSearch=id=>{
closeSearch();
const a=appointments.find(x=>x.id===id);
calendarDate.value=a.date;
renderCalendar();
setTimeout(()=>openEdit(id),50);
};

window.closeSearch=()=>searchModal.classList.add('hidden');

window.openStaff=()=>staffModal.classList.remove('hidden');
window.closeStaff=()=>staffModal.classList.add('hidden');

function renderStaff(){
staffList.innerHTML='';
staff.forEach((s,i)=>{
staffList.innerHTML+=`
<div class="staff-row">
<span>${s.name}</span>
<input type="color" value="${s.color}" onchange="updateStaffColor('${s.id}',this.value)">
<button onclick="moveStaff(${i},-1)">↑</button>
<button onclick="moveStaff(${i},1)">↓</button>
<button onclick="removeStaff('${s.id}')">✕</button>
</div>`;
});
}

window.addStaff=async()=>{
if(!newStaffName.value) return;
await addDoc(collection(db,"staff"),{
name:newStaffName.value,
color:newStaffColor.value
});
newStaffName.value='';
};

window.removeStaff=id=>deleteDoc(doc(db,"staff",id));
window.updateStaffColor=(id,color)=>updateDoc(doc(db,"staff",id),{color});

window.moveStaff=(i,d)=>{
const n=i+d;
if(n<0||n>=staff.length) return;
[staff[i],staff[n]]=[staff[n],staff[i]];
renderCalendar();
};

window.closeAppointment=()=>appointmentModal.classList.add('hidden');
window.closeDelete=()=>deleteModal.classList.add('hidden');
window.closeConflict=()=>conflictModal.classList.add('hidden');

renderCalendar();
</script>

</body>
</html>
