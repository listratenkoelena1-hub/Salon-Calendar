<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Salon Calendar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial, sans-serif; margin: 10px; }

header {
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:15px;
}
.header-left {
display:flex;
align-items:center;
gap:10px;
}
.header-right {
display:flex;
gap:10px;
}
#calendarDate {
font-size:18px;
padding:10px 14px;
}
header button {
font-size:14px;
padding:8px 14px;
border-radius:20px;
cursor:pointer;
}

#calendar-wrapper { overflow-x:auto; }

table {
border-collapse:collapse;
min-width:max-content;
table-layout:fixed;
}
th, td {
border:1px solid #ccc;
font-size:12px;
text-align:center;
}
th {
background:#f5f5f5;
height:44px;
font-weight:600;
color:#000;
width:120px;
max-width:120px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
td {
height:26px;
width:120px;
max-width:120px;
overflow:hidden;
}
.time {
width:75px !important;
min-width:75px;
background:#fafafa;
}

.slot { cursor:pointer; }
.slot.busy { border-radius:8px; box-sizing:border-box; }
.slot.busy.start { border:1px solid rgba(0,0,0,0.4); font-weight:600; }

.dayoff {
background:#eee !important;
color:#555;
pointer-events:none;
}
.dayoff-label {
font-size:11px;
font-weight:600;
}

.modal {
position:fixed;
inset:0;
background:rgba(0,0,0,.4);
display:flex;
align-items:center;
justify-content:center;
z-index:1000;
}
.hidden { display:none; }
.modal-content {
background:#fff;
padding:15px;
border-radius:12px;
width:380px;
max-height:90vh;
overflow:auto;
}
.modal-content label {
font-size:12px;
display:block;
margin-top:8px;
}
.modal-content input,
.modal-content select,
.modal-content textarea {
width:100%;
}
textarea { resize:none; }
.modal-actions {
display:flex;
justify-content:flex-end;
gap:8px;
margin-top:12px;
}

.staff-card {
display:flex;
align-items:center;
gap:8px;
padding:8px;
border:1px solid #ddd;
border-radius:8px;
margin-bottom:8px;
}
.staff-name { flex:1; font-weight:600; }
.staff-actions { display:flex; gap:4px; }

.search-item {
border-bottom:1px solid #ddd;
padding:6px;
cursor:pointer;
}
.search-item:hover { background:#f5f5f5; }
</style>
</head>

<body>

<header>
<div class="header-left">
<input type="date" id="calendarDate">
<button onclick="openAdd()">Add appointment</button>
</div>
<div class="header-right">
<button onclick="openDayOff()">Day off</button>
<button onclick="openSearch()">Search</button>
<button onclick="openStaff()">Staff</button>
</div>
</header>

<div id="calendar-wrapper">
<table id="calendar"></table>
</div>

<div id="appointmentModal" class="modal hidden">
<div class="modal-content">
<h3>Appointment</h3>

<label>Date</label>
<input id="aDate" type="date" readonly disabled>

<label>Staff</label>
<select id="aStaff"></select>

<label>Start time</label>
<select id="aTime"></select>

<label>Duration</label>
<select id="aDuration">
<option value="1">15 min</option>
<option value="2">30 min</option>
<option value="3">45 min</option>
<option value="4">01:00</option>
<option value="5">01:15</option>
<option value="6">01:30</option>
<option value="7">01:45</option>
<option value="8">02:00</option>
<option value="10">02:30</option>
<option value="12">03:00</option>
<option value="14">03:30</option>
</select>

<label>Client</label>
<input id="aClient">

<label>Note</label>
<textarea id="aNote"></textarea>

<div class="modal-actions">
<button onclick="saveAppointment()">Save</button>
<button onclick="closeAppointment()">Close</button>
</div>
</div>
</div>

<div id="dayOffModal" class="modal hidden">
<div class="modal-content">
<h3>Day off</h3>

<label>Date</label>
<input id="dDate" type="date" readonly disabled>

<label>Staff</label>
<select id="dStaff" onchange="updateRemoveButton()"></select>

<div class="modal-actions">
<button onclick="saveDayOff()">Save</button>
<button id="removeDayOffBtn" onclick="askRemoveDayOff()" disabled>Remove day off</button>
<button onclick="closeDayOff()">Close</button>
</div>
</div>
</div>

<div id="confirmRemoveDayOff" class="modal hidden">
<div class="modal-content">
<p>Remove day off for this staff?</p>
<div class="modal-actions">
<button onclick="removeDayOff()">Yes</button>
<button onclick="closeConfirmRemove()">Cancel</button>
</div>
</div>
</div>

<div id="searchModal" class="modal hidden">
<div class="modal-content">
<h3>Search client</h3>
<input id="searchInput" oninput="runSearch()" placeholder="Client name">
<div id="searchResults"></div>
<div class="modal-actions">
<button onclick="closeSearch()">Close</button>
</div>
</div>
</div>

<div id="staffModal" class="modal hidden">
<div class="modal-content">
<h3>Staff</h3>
<div id="staffList"></div>
<hr>
<input id="newStaffName" placeholder="Name">
<input type="color" id="newStaffColor" value="#cce5ff">
<div class="modal-actions">
<button onclick="addStaff()">Add</button>
<button onclick="closeStaff()">Close</button>
</div>
</div>
</div>

<div id="conflictModal" class="modal hidden">
<div class="modal-content">
<h3>⚠️ STAFF DAY OFF</h3>
<p>Sorry, this staff member is on day off.</p>
<div class="modal-actions">
<button onclick="closeConflict()">OK</button>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
getFirestore, collection, addDoc, updateDoc, deleteDoc,
doc, onSnapshot, query, where, getDocs
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

initializeApp({
apiKey:"AIzaSyC5BecKxYxQ9V5qbmXBNkTsvnIZBtK_dx8",
authDomain:"rosesnails-calendar.firebaseapp.com",
projectId:"rosesnails-calendar"
});

const db = getFirestore();

let staff=[], appointments=[], dayoffs=[], removeTarget=null;

const calendar=document.getElementById('calendar');
const calendarDate=document.getElementById('calendarDate');
calendarDate.valueAsDate=new Date();
calendarDate.onchange=renderCalendar;

const SLOTS=49;
const ANYONE_ID="anyone";

function timeLabel(i){
const t=8*60+i*15;
let h=Math.floor(t/60),m=t%60;
let am=h>=12?'PM':'AM'; h=h%12||12;
return `${h}:${String(m).padStart(2,'0')} ${am}`;
}

onSnapshot(collection(db,"staff"),s=>{
const real=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.order-b.order);
staff=[...real,{id:ANYONE_ID,name:"Anyone",color:"#eaeaea"}];
renderCalendar();
});

onSnapshot(collection(db,"appointments"),s=>{
appointments=s.docs.map(d=>({id:d.id,...d.data()}));
renderCalendar();
});

onSnapshot(collection(db,"dayoffs"),s=>{
dayoffs=s.docs.map(d=>({id:d.id,...d.data()}));
renderCalendar();
});

function isDayOff(staffId,date){
return dayoffs.find(d=>d.staffId===staffId && d.date===date);
}

function renderCalendar(){
calendar.innerHTML='';
let h='<tr><th class="time">Time</th>';
staff.forEach(s=>h+=`<th style="background:${s.color}">${s.name}</th>`);
h+='</tr>';
calendar.innerHTML+=h;

for(let i=0;i<SLOTS;i++){
let r=`<tr><td class="time">${timeLabel(i)}</td>`;
staff.forEach(s=>{
let cls=isDayOff(s.id,calendarDate.value)?'dayoff':'';
r+=`<td class="slot ${cls}" data-slot="${i}" data-staff="${s.id}"></td>`;
});
r+='</tr>';
calendar.innerHTML+=r;
}
drawAppointments();
drawDayOffLabels();
}

function drawDayOffLabels(){
staff.forEach(s=>{
if(isDayOff(s.id,calendarDate.value)){
const cell=document.querySelector(`.slot[data-slot="0"][data-staff="${s.id}"]`);
if(cell) cell.innerHTML='<div class="dayoff-label">DAY OFF</div>';
}
});
}

function drawAppointments(){
document.querySelectorAll('.slot').forEach(c=>{
c.innerHTML='';
c.style.background='';
c.classList.remove('busy','start');
c.onclick=null;
});

appointments.filter(a=>a.date===calendarDate.value).forEach(a=>{
if(isDayOff(a.staffId,a.date)) return;
const si=staff.find(s=>s.id===a.staffId);
if(!si) return;
for(let i=0;i<(a.duration||1);i++){
const cell=document.querySelector(`.slot[data-slot="${a.start+i}"][data-staff="${a.staffId}"]`);
if(cell){
cell.style.background=si.color;
cell.classList.add('busy');
if(i===0){ cell.classList.add('start'); cell.innerHTML=a.client; }
cell.onclick=()=>{};
}
}
});
}

window.openAdd=()=>{
appointmentModal.classList.remove('hidden');
aDate.value=calendarDate.value;
aStaff.innerHTML=staff.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
aTime.innerHTML=[...Array(SLOTS).keys()].map(i=>`<option value="${i}">${timeLabel(i)}</option>`).join('');
aClient.value=''; aNote.value='';
};

window.saveAppointment=async()=>{
const data={
date:calendarDate.value,
staffId:aStaff.value,
start:+aTime.value,
duration:+aDuration.value,
client:aClient.value,
note:aNote.value
};
if(isDayOff(data.staffId,data.date)){ conflictModal.classList.remove('hidden'); return; }
await addDoc(collection(db,"appointments"),data);
closeAppointment();
};

window.openDayOff=()=>{
dayOffModal.classList.remove('hidden');
dDate.value=calendarDate.value;
dStaff.innerHTML=staff.filter(s=>s.id!==ANYONE_ID).map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
updateRemoveButton();
};

function updateRemoveButton(){
const off=isDayOff(dStaff.value,dDate.value);
removeDayOffBtn.disabled=!off;
removeTarget=off||null;
}

window.saveDayOff=async()=>{
await addDoc(collection(db,"dayoffs"),{ date:dDate.value, staffId:dStaff.value });
closeDayOff();
};

window.askRemoveDayOff=()=>{
confirmRemoveDayOff.classList.remove('hidden');
};

window.removeDayOff=async()=>{
if(removeTarget) await deleteDoc(doc(db,"dayoffs",removeTarget.id));
closeConfirmRemove(); closeDayOff();
};

window.closeConfirmRemove=()=>confirmRemoveDayOff.classList.add('hidden');
window.closeDayOff=()=>dayOffModal.classList.add('hidden');
window.openSearch=()=>searchModal.classList.remove('hidden');
window.closeSearch=()=>searchModal.classList.add('hidden');
window.openStaff=()=>staffModal.classList.remove('hidden');
window.closeStaff=()=>staffModal.classList.add('hidden');
window.closeAppointment=()=>appointmentModal.classList.add('hidden');
window.closeConflict=()=>conflictModal.classList.add('hidden');

renderCalendar();
</script>

</body>
</html>
