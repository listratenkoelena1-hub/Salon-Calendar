<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Salon Calendar</title>

<style>
body { font-family: Arial, sans-serif; padding: 10px; }
header { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid #ccc; text-align: center; font-size: 12px; height: 28px; }
th { background: #f2f2f2; position: sticky; top: 0; }
.time { width: 80px; background: #fafafa; font-weight: bold; }
.appointment { cursor: pointer; }
button { padding: 6px 10px; }
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; }
.modal-content { background: #fff; padding: 15px; width: 320px; }
.staff-row { display:flex; gap:5px; margin-bottom:5px; }
</style>
</head>

<body>

<header>
<input type="date" id="currentDate">
<button onclick="openAdd()">Add appointment</button>
<button onclick="openStaff()">Staff</button>
</header>

<table>
<thead>
<tr id="headerRow"><th>Time</th></tr>
</thead>
<tbody id="calendarBody"></tbody>
</table>

<!-- ADD / EDIT APPOINTMENT -->
<div class="modal" id="appointmentModal">
<div class="modal-content">
<h3 id="modalTitle">Add appointment</h3>

<label>Date</label>
<input type="date" id="appDate"><br><br>

<label>Staff</label>
<select id="appStaff"></select><br><br>

<label>Start time</label>
<select id="appTime"></select><br><br>

<label>Duration</label>
<select id="appDuration">
<option value="15">00:15</option>
<option value="30">00:30</option>
<option value="45">00:45</option>
<option value="60">01:00</option>
<option value="75">01:15</option>
<option value="90">01:30</option>
<option value="105">01:45</option>
<option value="120">02:00</option>
<option value="150">02:30</option>
<option value="180">03:00</option>
<option value="210">03:30</option>
</select><br><br>

<label>Client</label>
<input id="appClient"><br><br>

<label>Note</label>
<input id="appNote"><br><br>

<button onclick="saveAppointment()">Save</button>
<button onclick="deleteAppointment()" id="deleteBtn" style="display:none">Delete</button>
<button onclick="closeModals()">Cancel</button>
</div>
</div>

<!-- STAFF -->
<div class="modal" id="staffModal">
<div class="modal-content">
<h3>Staff</h3>
<div id="staffList"></div>
<input id="newStaffName" placeholder="Name">
<input type="color" id="newStaffColor">
<button onclick="addStaff()">Add</button><br><br>
<button onclick="closeModals()">Close</button>
</div>
</div>

<script>
const TIMES=[];
for(let h=8;h<20;h++){for(let m=0;m<60;m+=15){
TIMES.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);}}

let staff=JSON.parse(localStorage.getItem("staff"))||[{id:1,name:"Anna",color:"#FFE4CC"}];
let appointments=JSON.parse(localStorage.getItem("appointments"))||[];
let editingIndex=null;

currentDate.valueAsDate=new Date();

function buildCalendar(){
headerRow.innerHTML="<th>Time</th>";
staff.forEach(s=>headerRow.innerHTML+=`<th>${s.name}</th>`);
calendarBody.innerHTML="";
TIMES.forEach(t=>{
let tr=document.createElement("tr");
tr.innerHTML=`<td class="time">${t}</td>`;
staff.forEach(()=>tr.innerHTML+="<td></td>");
calendarBody.appendChild(tr);
});
renderAppointments();
}

function openAdd(){
editingIndex=null;
modalTitle.innerText="Add appointment";
deleteBtn.style.display="none";
appointmentModal.style.display="flex";
appDate.value=currentDate.value;
fillSelectors();
}

function fillSelectors(){
appStaff.innerHTML=staff.map(s=>`<option value="${s.id}">${s.name}</option>`).join("");
appTime.innerHTML=TIMES.map(t=>`<option>${t}</option>`).join("");
}

function saveAppointment(){
const data={
date:appDate.value,
staff:+appStaff.value,
time:appTime.value,
duration:+appDuration.value,
client:appClient.value,
note:appNote.value
};

if(editingIndex!==null) appointments.splice(editingIndex,1);

const start=TIMES.indexOf(data.time);
const blocks=data.duration/15;
for(let i=0;i<blocks;i++){
if(appointments.find(a=>a.date===data.date&&a.staff===data.staff&&TIMES.indexOf(a.time)===start+i)){
alert("Time conflict"); return;
}}

appointments.push(data);
localStorage.setItem("appointments",JSON.stringify(appointments));
closeModals(); renderAppointments();
}

function renderAppointments(){
document.querySelectorAll(".appointment").forEach(e=>e.innerHTML="");
appointments.filter(a=>a.date===currentDate.value).forEach((a,i)=>{
const col=staff.findIndex(s=>s.id===a.staff)+1;
const start=TIMES.indexOf(a.time);
const blocks=a.duration/15;
for(let b=0;b<blocks;b++){
const cell=calendarBody.rows[start+b].cells[col];
cell.className="appointment";
cell.style.background=staff.find(s=>s.id===a.staff).color;
cell.onclick=()=>editAppointment(i);
if(b===0) cell.innerHTML=`<b>${a.client}</b>`;
}
});
}

function editAppointment(i){
const a=appointments[i];
editingIndex=i;
modalTitle.innerText="Edit appointment";
deleteBtn.style.display="inline";
appointmentModal.style.display="flex";
appDate.value=a.date;
fillSelectors();
appStaff.value=a.staff;
appTime.value=a.time;
appDuration.value=a.duration;
appClient.value=a.client;
appNote.value=a.note;
}

function deleteAppointment(){
appointments.splice(editingIndex,1);
localStorage.setItem("appointments",JSON.stringify(appointments));
closeModals(); renderAppointments();
}

function openStaff(){
staffModal.style.display="flex";
staffList.innerHTML="";
staff.forEach((s,i)=>{
staffList.innerHTML+=`
<div class="staff-row">
<input value="${s.name}" onchange="staff[${i}].name=this.value;saveStaff()">
<input type="color" value="${s.color}" onchange="staff[${i}].color=this.value;saveStaff()">
<button onclick="deleteStaff(${i})">✖</button>
</div>`;
});
}

function addStaff(){
staff.push({id:Date.now(),name:newStaffName.value,color:newStaffColor.value});
saveStaff();
}

function deleteStaff(i){
staff.splice(i,1); saveStaff();
}

function saveStaff(){
localStorage.setItem("staff",JSON.stringify(staff));
buildCalendar();
}

function closeModals(){
document.querySelectorAll(".modal").forEach(m=>m.style.display="none");
}

currentDate.onchange=renderAppointments;
buildCalendar();
</script>

</body>
</html>
