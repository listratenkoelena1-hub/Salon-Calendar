<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Salon Calendar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial, sans-serif; margin: 10px; }

/* HEADER */
header {
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:15px;
}
.header-left {
display:flex;
align-items:center;
gap:10px;
}
.header-right {
display:flex;
gap:10px;
}
#calendarDate {
font-size:18px;
padding:10px 14px;
}
header button {
font-size:14px;
padding:8px 14px;
border-radius:20px;
cursor:pointer;
}

/* CALENDAR */
#calendar-wrapper { overflow-x:auto; }

table {
border-collapse:collapse;
min-width:max-content;
table-layout:fixed;
}
th, td {
border:1px solid #ccc;
font-size:12px;
text-align:center;
}
th {
background:#f5f5f5;
height:44px;
font-weight:600;
width:120px;
}
td {
height:32px;
width:120px;
}
.time {
width:75px !important;
background:#fafafa;
}
.slot { cursor:pointer; }
.slot.busy {
border:1px solid rgba(0,0,0,0.4);
border-radius:8px;
font-weight:600;
padding:2px 4px;
}

/* MODALS */
.modal {
position:fixed;
inset:0;
background:rgba(0,0,0,.4);
display:flex;
align-items:center;
justify-content:center;
z-index:1000;
}
.hidden { display:none; }
.modal-content {
background:#fff;
padding:15px;
border-radius:12px;
width:380px;
}
.modal-actions {
display:flex;
justify-content:flex-end;
gap:8px;
margin-top:12px;
}
</style>
</head>

<body>

<header>
<div class="header-left">
<input type="date" id="calendarDate">
<button onclick="openAdd()">Add appointment</button>
</div>
<div class="header-right">
<button onclick="openDayOff()">Day off</button>
<button onclick="openSearch()">Search</button>
<button onclick="openStaff()">Staff</button>
</div>
</header>

<div id="calendar-wrapper">
<table id="calendar"></table>
</div>

<!-- APPOINTMENT MODAL -->
<div id="appointmentModal" class="modal hidden">
<div class="modal-content">
<h3>Appointment</h3>

<label>Date</label>
<input id="aDate" type="date" disabled>

<label>Staff</label>
<select id="aStaff"></select>

<label>Start</label>
<select id="aTime"></select>

<label>Duration</label>
<select id="aDuration">
<option value="1">15 min</option>
<option value="2">30 min</option>
<option value="4">1:00</option>
</select>

<label>Client</label>
<input id="aClient">

<div class="modal-actions">
<button onclick="saveAppointment()">Save</button>
<button onclick="closeAppointment()">Close</button>
</div>
</div>
</div>

<!-- DAY OFF MODAL -->
<div id="dayOffModal" class="modal hidden">
<div class="modal-content">
<h3>Day off</h3>

<label>Date</label>
<input id="dDate" type="date" disabled>

<label>Staff</label>
<select id="dStaff"></select>

<div class="modal-actions">
<button onclick="saveDayOff()">Save</button>
<button disabled>Remove</button>
<button onclick="closeDayOff()">Close</button>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
getFirestore, collection, addDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

initializeApp({
apiKey:"AIzaSyC5BecKxYxQ9V5qbmXBNkTsvnIZBtK_dx8",
authDomain:"rosesnails-calendar.firebaseapp.com",
projectId:"rosesnails-calendar"
});

const db = getFirestore();

let staff=[], appointments=[];
const calendar=document.getElementById('calendar');
const calendarDate=document.getElementById('calendarDate');
calendarDate.valueAsDate=new Date();

const SLOTS=49;
const ANYONE_ID="anyone";

function timeLabel(i){
const t=8*60+i*15;
let h=Math.floor(t/60),m=t%60;
let am=h>=12?'PM':'AM'; h=h%12||12;
return `${h}:${String(m).padStart(2,'0')} ${am}`;
}

onSnapshot(collection(db,"staff"),s=>{
staff=s.docs.map(d=>({id:d.id,...d.data()}));
renderCalendar();
});

onSnapshot(collection(db,"appointments"),s=>{
appointments=s.docs.map(d=>({id:d.id,...d.data()}));
renderCalendar();
});

function renderCalendar(){
calendar.innerHTML='';
let h='<tr><th class="time">Time</th>';
staff.forEach(s=>h+=`<th>${s.name}</th>`);
h+='</tr>';
calendar.innerHTML+=h;

for(let i=0;i<SLOTS;i++){
let r=`<tr><td class="time">${timeLabel(i)}</td>`;
staff.forEach(()=>r+=`<td class="slot"></td>`);
r+='</tr>';
calendar.innerHTML+=r;
}
}

window.openDayOff=()=>{
dayOffModal.classList.remove('hidden');
dDate.value=calendarDate.value;
dStaff.innerHTML=staff.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
};

window.saveDayOff=async()=>{
await addDoc(collection(db,"dayoffs"),{
date:dDate.value,
staffId:dStaff.value
});
closeDayOff();
};

window.closeDayOff=()=>dayOffModal.classList.add('hidden');
window.openAdd=()=>appointmentModal.classList.remove('hidden');
window.closeAppointment=()=>appointmentModal.classList.add('hidden');

renderCalendar();
</script>

</body>
</html>
