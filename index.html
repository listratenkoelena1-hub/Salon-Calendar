<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Календарь салона</title>

<style>
body {
font-family: Arial, sans-serif;
margin: 10px;
}

h3 {
margin-bottom: 10px;
}

table {
border-collapse: collapse;
width: 100%;
}

th, td {
border: 1px solid #ccc;
padding: 6px;
text-align: center;
font-size: 13px;
}

th {
background: #f2f2f2;
position: sticky;
top: 0;
z-index: 2;
}

.time {
background: #fafafa;
font-weight: bold;
position: sticky;
left: 0;
z-index: 1;
}
</style>
</head>

<body>

<h3>Календарь записей</h3>

<label>
Дата:
<input type="date">
</label>

<br><br>

<table>
<thead>
<tr>
<th>Time</th>
<th>Master 1</th>
<th>Master 2</th>
<th>Master 3</th>
<th>Master 4</th>
<th>Master 5</th>
<th>Master 6</th>
<th>Master 7</th>
<th>Master 8</th>
<th>Master 9</th>
<th>Anyone</th>
</tr>
</thead>

<tbody id="calendarBody"></tbody>
</table>

<script>
const tbody = document.getElementById('calendarBody');

for (let h = 8; h <= 20; h++) {
for (let m = 0; m < 60; m += 15) {

let hour12 = h % 12 === 0 ? 12 : h % 12;
let ampm = h < 12 ? 'AM' : 'PM';
let timeLabel = hour12 + ':' + String(m).padStart(2, '0') + ' ' + ampm;

const tr = document.createElement('tr');

const timeCell = document.createElement('td');
timeCell.className = 'time';
timeCell.textContent = timeLabel;
tr.appendChild(timeCell);

for (let i = 0; i < 10; i++) {
const td = document.createElement('td');
tr.appendChild(td);
}

tbody.appendChild(tr);
}
}
</script>

</body>
</html>
