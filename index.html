<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Salon Calendar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial, sans-serif; margin: 10px; }
header { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
table { border-collapse: collapse; width: 100%; table-layout: fixed; }
th, td { border: 1px solid #ccc; height: 32px; text-align: center; font-size: 12px; }
th { background: #f5f5f5; }
.time { width: 70px; background: #fafafa; }
.slot { cursor: pointer; }

.appointment {
font-size: 11px;
color: #000;
border-radius: 4px;
}

button { padding: 6px 10px; }

.modal {
position: fixed;
inset: 0;
background: rgba(0,0,0,0.4);
display: flex;
align-items: center;
justify-content: center;
z-index: 1000;
}
.hidden { display: none; }
.modal-content {
background: white;
padding: 15px;
border-radius: 10px;
width: 300px;
}
.modal-content h3 { margin-top: 0; }
.modal-content label { display: block; margin-top: 8px; font-size: 12px; }
.modal-content input, .modal-content select, .modal-content textarea {
width: 100%;
}
.modal-content textarea { resize: none; }

.staff-item {
display: flex;
justify-content: space-between;
align-items: center;
margin: 5px 0;
}
</style>
</head>

<body>

<header>
<input type="date" id="calendarDate">
<button onclick="openAdd()">Add appointment</button>
<button onclick="openStaff()">Staff</button>
</header>

<table id="calendar"></table>

<!-- ADD / EDIT APPOINTMENT -->
<div id="appointmentModal" class="modal hidden">
<div class="modal-content">
<h3>Appointment</h3>

<label>Date</label>
<input type="date" id="aDate" readonly>

<label>Staff</label>
<select id="aStaff"></select>

<label>Start time</label>
<select id="aTime"></select>

<label>Duration</label>
<select id="aDuration">
<option value="15">15 min</option>
<option value="30">30 min</option>
<option value="45">45 min</option>
<option value="60">1:00</option>
<option value="75">1:15</option>
<option value="90">1:30</option>
<option value="105">1:45</option>
<option value="120">2:00</option>
<option value="150">2:30</option>
<option value="180">3:00</option>
</select>

<label>Client</label>
<input id="aClient">

<label>Note</label>
<textarea id="aNote"></textarea>

<br>
<button onclick="saveAppointment()">Save</button>
<button onclick="deleteAppointment()">Delete</button>
<button onclick="closeAppointment()">Cancel</button>
</div>
</div>

<!-- STAFF -->
<div id="staffModal" class="modal hidden">
<div class="modal-content">
<h3>Staff</h3>
<div id="staffList"></div>
<hr>
<input id="newStaffName" placeholder="Name">
<input type="color" id="newStaffColor" value="#cce5ff">
<button onclick="addStaff()">Add</button>
<br><br>
<button onclick="closeStaff()">Close</button>
</div>
</div>

<!-- CONFLICT -->
<div id="conflictModal" class="modal hidden">
<div class="modal-content">
<h3>⚠️ Time conflict</h3>
<p>This staff member is busy.<br>Please choose another time.</p>
<button onclick="closeConflict()">OK</button>
</div>
</div>

<script>
/* ===== EXISTING LOGIC (НЕ ТРОГАЛИ) ===== */

let staff = [
{name:'Anna', color:'#ffe0b2'},
{name:'Maria', color:'#e1bee7'},
{name:'Olga', color:'#c8e6c9'}
];

let appointments = [];
let editIndex = null;

const calendar = document.getElementById('calendar');
const calendarDate = document.getElementById('calendarDate');
calendarDate.valueAsDate = new Date();

calendarDate.onchange = renderCalendar;

function timeSlots() {
let slots = [];
for (let h=8; h<=20; h++) {
for (let m=0; m<60; m+=15) {
if (h===20 && m>0) continue;
let date = new Date();
date.setHours(h,m,0,0);
slots.push(date.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}));
}
}
return slots;
}

function renderCalendar() {
calendar.innerHTML = '';
let header = '<tr><th class="time">Time</th>';
staff.forEach(s => header += `<th>${s.name}</th>`);
header += '</tr>';
calendar.innerHTML += header;

timeSlots().forEach(t => {
let row = `<tr><td class="time">${t}</td>`;
staff.forEach((_,i)=> row+=`<td class="slot" data-time="${t}" data-staff="${i}"></td>`);
row+='</tr>';
calendar.innerHTML+=row;
});

drawAppointments();
}

function drawAppointments() {
document.querySelectorAll('.slot').forEach(td=>td.innerHTML='');

appointments
.filter(a=>a.date===calendarDate.value)
.forEach((a,i)=>{
let startIndex = timeSlots().indexOf(a.time);
let blocks = a.duration/15;
for (let b=0;b<blocks;b++) {
let cell = document.querySelector(
`.slot[data-time="${timeSlots()[startIndex+b]}"][data-staff="${a.staff}"]`
);
if (cell) {
cell.innerHTML = b===0 ? a.client : '';
cell.style.background = staff[a.staff].color;
cell.onclick = ()=>openEdit(i);
}
}
});
}

function openAdd() {
editIndex=null;
document.getElementById('appointmentModal').classList.remove('hidden');
document.getElementById('aDate').value = calendarDate.value;
fillSelects();
}

function openEdit(i) {
editIndex=i;
let a=appointments[i];
openAdd();
aStaff.value=a.staff;
aTime.value=a.time;
aDuration.value=a.duration;
aClient.value=a.client;
aNote.value=a.note;
}

function closeAppointment(){
document.getElementById('appointmentModal').classList.add('hidden');
}

function fillSelects(){
aStaff.innerHTML='';
staff.forEach((s,i)=>aStaff.innerHTML+=`<option value="${i}">${s.name}</option>`);
aTime.innerHTML='';
timeSlots().forEach(t=>aTime.innerHTML+=`<option>${t}</option>`);
}

function saveAppointment(){
let data={
date: calendarDate.value,
staff:+aStaff.value,
time:aTime.value,
duration:+aDuration.value,
client:aClient.value,
note:aNote.value
};

let conflict = appointments.some((a,i)=>{
if (editIndex===i) return false;
if (a.date!==data.date || a.staff!==data.staff) return false;
let s1=timeSlots().indexOf(a.time);
let e1=s1+a.duration/15;
let s2=timeSlots().indexOf(data.time);
let e2=s2+data.duration/15;
return Math.max(s1,s2)<Math.min(e1,e2);
});

if (conflict) {
document.getElementById('conflictModal').classList.remove('hidden');
return;
}

if (editIndex!==null) appointments[editIndex]=data;
else appointments.push(data);

closeAppointment();
renderCalendar();
}

function deleteAppointment(){
if (editIndex!==null) appointments.splice(editIndex,1);
closeAppointment();
renderCalendar();
}

function openStaff(){
document.getElementById('staffModal').classList.remove('hidden');
renderStaff();
}

function closeStaff(){
document.getElementById('staffModal').classList.add('hidden');
}

function renderStaff(){
staffList.innerHTML='';
staff.forEach((s,i)=>{
staffList.innerHTML+=`
<div class="staff-item">
<span>${s.name}</span>
<button onclick="removeStaff(${i})">Delete</button>
</div>`;
});
}

function addStaff(){
if(!newStaffName.value) return;
staff.push({name:newStaffName.value,color:newStaffColor.value});
newStaffName.value='';
renderStaff();
renderCalendar();
}

function removeStaff(i){
staff.splice(i,1);
renderStaff();
renderCalendar();
}

function closeConflict(){
document.getElementById('conflictModal').classList.add('hidden');
}

renderCalendar();
</script>
