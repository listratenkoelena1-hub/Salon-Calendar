<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Salon Calendar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial, sans-serif; margin: 10px; }

header {
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:15px;
}
.header-left {
display:flex;
align-items:center;
gap:10px;
}
.header-right {
display:flex;
gap:10px;
}
#calendarDate {
font-size:18px;
padding:10px 14px;
}
header button {
font-size:14px;
padding:8px 14px;
border-radius:20px;
cursor:pointer;
}

#calendar-wrapper { overflow-x:auto; }

table {
border-collapse:collapse;
min-width:max-content;
table-layout:fixed;
}
th, td {
border:1px solid #ccc;
font-size:12px;
text-align:center;
}
th {
background:#f5f5f5;
height:44px;
font-weight:600;
color:#000;
width:120px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
td {
height:26px;
width:120px;
overflow:hidden;
}
.time {
width:75px !important;
min-width:75px;
background:#fafafa;
}

.slot { cursor:pointer; }
.slot.busy { border-radius:8px; }
.slot.busy.start { border:1px solid rgba(0,0,0,0.4); font-weight:600; }

.dayoff {
background:#eee !important;
color:#555;
pointer-events:none;
}
.dayoff-label {
font-size:11px;
font-weight:600;
}

.modal {
position:fixed;
inset:0;
background:rgba(0,0,0,.4);
display:flex;
align-items:center;
justify-content:center;
z-index:1000;
}
.hidden { display:none; }
.modal-content {
background:#fff;
padding:15px;
border-radius:12px;
width:380px;
max-height:90vh;
overflow:auto;
}
.modal-content label {
font-size:12px;
display:block;
margin-top:8px;
}
.modal-content input,
.modal-content select,
.modal-content textarea {
width:100%;
}
textarea { resize:none; }
.modal-actions {
display:flex;
justify-content:flex-end;
gap:8px;
margin-top:12px;
}

button[disabled] {
opacity:0.4;
cursor:not-allowed;
}
</style>
</head>

<body>

<header>
<div class="header-left">
<input type="date" id="calendarDate">
<button onclick="openAdd()">Add appointment</button>
</div>
<div class="header-right">
<button onclick="openDayOff()">Day off</button>
<button onclick="openSearch()">Search</button>
<button onclick="openStaff()">Staff</button>
</div>
</header>

<div id="calendar-wrapper">
<table id="calendar"></table>
</div>

<div id="dayOffModal" class="modal hidden">
<div class="modal-content">
<h3>Day off</h3>

<label>Date</label>
<input id="dDate" type="date" readonly disabled>

<label>Staff</label>
<select id="dStaff" onchange="updateRemoveButton()"></select>

<div class="modal-actions">
<button id="removeDayOffBtn" onclick="removeDayOff()" disabled>Remove day off</button>
<button onclick="saveDayOff()">Save</button>
<button onclick="closeDayOff()">Close</button>
</div>
</div>
</div>

<div id="conflictModal" class="modal hidden">
<div class="modal-content">
<h3>⚠️ STAFF DAY OFF</h3>
<p>Sorry, this staff member is on day off.</p>
<div class="modal-actions">
<button onclick="closeConflict()">OK</button>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
getFirestore, collection, addDoc, deleteDoc,
doc, onSnapshot, query, where, getDocs
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

initializeApp({
apiKey:"AIzaSyC5BecKxYxQ9V5qbmXBNkTsvnIZBtK_dx8",
authDomain:"rosesnails-calendar.firebaseapp.com",
projectId:"rosesnails-calendar"
});

const db = getFirestore();

let staff=[], dayoffs=[];
const calendar=document.getElementById('calendar');
const calendarDate=document.getElementById('calendarDate');
calendarDate.valueAsDate=new Date();

const SLOTS=49;
const ANYONE_ID="anyone";

onSnapshot(collection(db,"staff"),s=>{
const real=s.docs.map(d=>({id:d.id,...d.data()}));
staff=[...real,{id:ANYONE_ID,name:"Anyone",color:"#eaeaea"}];
renderCalendar();
});

onSnapshot(collection(db,"dayoffs"),s=>{
dayoffs=s.docs.map(d=>({id:d.id,...d.data()}));
renderCalendar();
});

function isDayOff(staffId,date){
return dayoffs.find(d=>d.staffId===staffId && d.date===date);
}

function renderCalendar(){
calendar.innerHTML='';
let h='<tr><th class="time">Time</th>';
staff.forEach(s=>h+=`<th>${s.name}</th>`);
h+='</tr>';
calendar.innerHTML+=h;

for(let i=0;i<SLOTS;i++){
let r='<tr><td class="time"></td>';
staff.forEach(s=>{
let cls=isDayOff(s.id,calendarDate.value)?'dayoff':'';
r+=`<td class="slot ${cls}"></td>`;
});
r+='</tr>';
calendar.innerHTML+=r;
}
}

window.openDayOff=()=>{
dayOffModal.classList.remove('hidden');
dDate.value=calendarDate.value;
dStaff.innerHTML=staff.filter(s=>s.id!==ANYONE_ID)
.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
updateRemoveButton();
};

window.updateRemoveButton=()=>{
const exists=isDayOff(dStaff.value,dDate.value);
removeDayOffBtn.disabled=!exists;
};

window.saveDayOff=async()=>{
await addDoc(collection(db,"dayoffs"),{
date:dDate.value,
staffId:dStaff.value
});
closeDayOff();
};

window.removeDayOff=async()=>{
const record=isDayOff(dStaff.value,dDate.value);
if(record){
await deleteDoc(doc(db,"dayoffs",record.id));
}
closeDayOff();
};

window.closeDayOff=()=>dayOffModal.classList.add('hidden');
window.closeConflict=()=>conflictModal.classList.add('hidden');

renderCalendar();
</script>

</body>
</html>
