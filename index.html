<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Salon Calendar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial, sans-serif; margin: 10px; }
header { display:flex; gap:12px; margin-bottom:15px; }
header input, header button { font-size:16px; padding:8px 12px; }

table { border-collapse:collapse; width:100%; table-layout:fixed; }
th, td { border:1px solid #ccc; height:32px; font-size:12px; text-align:center; }
th { background:#f5f5f5; }
.time { width:75px; background:#fafafa; }
.slot { cursor:pointer; }

.modal {
position:fixed; inset:0;
background:rgba(0,0,0,.4);
display:flex; align-items:center; justify-content:center;
}
.hidden { display:none; }
.modal-content {
background:#fff; padding:15px; border-radius:10px; width:320px;
}
.modal-content label { display:block; margin-top:8px; font-size:12px; }
.modal-content input, select, textarea { width:100%; }
</style>
</head>

<body>

<header>
<input type="date" id="calendarDate">
<button onclick="openAdd()">Add appointment</button>
</header>

<table id="calendar"></table>

<!-- APPOINTMENT -->
<div id="appointmentModal" class="modal hidden">
<div class="modal-content">
<h3>Appointment</h3>

<label>Date</label>
<input id="aDate" type="date" readonly disabled>

<label>Staff</label>
<select id="aStaff"></select>

<label>Start time</label>
<select id="aTime"></select>

<label>Duration</label>
<select id="aDuration">
<option value="1">15 min</option>
<option value="2">30 min</option>
<option value="4">1:00</option>
<option value="6">1:30</option>
<option value="8">2:00</option>
</select>

<label>Client</label>
<input id="aClient">

<br>
<button onclick="saveAppointment()">Save</button>
<button onclick="askDelete()">Delete</button>
<button onclick="closeAppointment()">Close</button>
</div>
</div>

<!-- DELETE CONFIRM -->
<div id="deleteModal" class="modal hidden">
<div class="modal-content">
<p>Delete appointment?</p>
<button onclick="deleteAppointment()">Yes</button>
<button onclick="closeDelete()">No</button>
</div>
</div>

<!-- CONFLICT -->
<div id="conflictModal" class="modal hidden">
<div class="modal-content">
<p>⚠️ Time conflict</p>
<button onclick="closeConflict()">OK</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

initializeApp({
apiKey:"AIzaSyC5BecKxYxQ9V5qbmXBNkTsvnIZBtK_dx8",
authDomain:"rosesnails-calendar.firebaseapp.com",
projectId:"rosesnails-calendar"
});

const db = getFirestore();

let staff = [];
let appointments = [];
let editId = null;

const SLOTS = 49;
const calendar = document.getElementById('calendar');
const calendarDate = document.getElementById('calendarDate');
calendarDate.valueAsDate = new Date();
calendarDate.onchange = renderCalendar;

function timeLabel(i){
const t = 8*60 + i*15;
let h = Math.floor(t/60), m=t%60;
let am=h>=12?'PM':'AM';
h=h%12||12;
return `${h}:${String(m).padStart(2,'0')} ${am}`;
}

onSnapshot(collection(db,"staff"), s=>{
staff = s.docs.map(d=>({id:d.id,...d.data()}));
renderCalendar();
});

onSnapshot(collection(db,"appointments"), s=>{
appointments = s.docs.map(d=>({id:d.id,...d.data()}));
renderCalendar();
});

function renderCalendar(){
calendar.innerHTML='';
let h='<tr><th class="time">Time</th>';
staff.forEach(s=>h+=`<th>${s.name}</th>`);
h+='</tr>';
calendar.innerHTML+=h;

for(let i=0;i<SLOTS;i++){
let r=`<tr><td class="time">${timeLabel(i)}</td>`;
staff.forEach((_,s)=>r+=`<td class="slot" data-slot="${i}" data-staff="${s}"></td>`);
r+='</tr>';
calendar.innerHTML+=r;
}

drawAppointments();
}

function drawAppointments(){
document.querySelectorAll('.slot').forEach(c=>{
c.innerHTML=''; c.style.background=''; c.onclick=null;
});

appointments.filter(a=>a.date===calendarDate.value).forEach(a=>{
const si = staff.findIndex(s=>s.id===a.staffId);
for(let i=0;i<a.duration;i++){
const cell=document.querySelector(`.slot[data-slot="${a.start+i}"][data-staff="${si}"]`);
if(cell){
cell.style.background=staff[si].color;
if(i===0) cell.innerHTML=a.client;
cell.onclick=()=>openEdit(a.id);
}
}
});
}

window.openAdd=()=>{
editId=null;
aDate.value=calendarDate.value;
aStaff.innerHTML=staff.map((s,i)=>`<option value="${i}">${s.name}</option>`).join('');
aTime.innerHTML=[...Array(SLOTS).keys()].map(i=>`<option value="${i}">${timeLabel(i)}</option>`).join('');
aClient.value='';
appointmentModal.classList.remove('hidden');
};

window.openEdit=id=>{
const a=appointments.find(x=>x.id===id);
editId=id;
openAdd();
aStaff.value=staff.findIndex(s=>s.id===a.staffId);
aTime.value=a.start;
aDuration.value=a.duration;
aClient.value=a.client;
};

window.saveAppointment=async()=>{
const data={
date:calendarDate.value,
staffId:staff[aStaff.value].id,
start:+aTime.value,
duration:+aDuration.value,
client:aClient.value
};

const conflict = appointments.some(a=>{
if(a.id===editId) return false;
if(a.date!==data.date||a.staffId!==data.staffId) return false;
return Math.max(a.start,data.start)<Math.min(a.start+a.duration,data.start+data.duration);
});

if(conflict){ conflictModal.classList.remove('hidden'); return; }

if(editId){
await updateDoc(doc(db,"appointments",editId), data);
} else {
await addDoc(collection(db,"appointments"), data);
}

closeAppointment();
};

window.askDelete=()=>deleteModal.classList.remove('hidden');
window.closeDelete=()=>deleteModal.classList.add('hidden');

window.deleteAppointment=async()=>{
await deleteDoc(doc(db,"appointments",editId));
editId=null;
closeDelete();
closeAppointment();
};

window.closeAppointment=()=>appointmentModal.classList.add('hidden');
window.closeConflict=()=>conflictModal.classList.add('hidden');

renderCalendar();
</script>

</body>
</html>
