<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Salon Calendar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial, sans-serif; margin: 10px; }
header { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
table { border-collapse: collapse; width: 100%; table-layout: fixed; }
th, td { border: 1px solid #ccc; height: 32px; text-align: center; font-size: 12px; }
th { background: #f5f5f5; }
.time { width: 70px; background: #fafafa; }
.slot { cursor: pointer; }

button { padding: 6px 10px; }

.modal {
position: fixed;
inset: 0;
background: rgba(0,0,0,0.4);
display: flex;
align-items: center;
justify-content: center;
z-index: 1000;
}
.hidden { display: none; }
.modal-content {
background: white;
padding: 15px;
border-radius: 10px;
width: 300px;
}
.modal-content label { display: block; margin-top: 8px; font-size: 12px; }
.modal-content input,
.modal-content select,
.modal-content textarea { width: 100%; }
.staff-item {
display: flex;
justify-content: space-between;
margin: 5px 0;
}
</style>
</head>

<body>

<header>
<input type="date" id="calendarDate">
<button onclick="openAdd()">Add appointment</button>
<button onclick="openStaff()">Staff</button>
</header>

<table id="calendar"></table>

<!-- APPOINTMENT -->
<div id="appointmentModal" class="modal hidden">
<div class="modal-content">
<h3>Appointment</h3>

<label>Date</label>
<input type="date" id="aDate" readonly>

<label>Staff</label>
<select id="aStaff"></select>

<label>Start time</label>
<select id="aTime"></select>

<label>Duration</label>
<select id="aDuration">
<option value="15">15 min</option>
<option value="30">30 min</option>
<option value="45">45 min</option>
<option value="60">1:00</option>
<option value="75">1:15</option>
<option value="90">1:30</option>
<option value="105">1:45</option>
<option value="120">2:00</option>
<option value="150">2:30</option>
<option value="180">3:00</option>
</select>

<label>Client</label>
<input id="aClient">

<label>Note</label>
<textarea id="aNote"></textarea>

<br>
<button onclick="saveAppointment()">Save</button>
<button onclick="closeAppointment()">Cancel</button>
</div>
</div>

<!-- STAFF -->
<div id="staffModal" class="modal hidden">
<div class="modal-content">
<h3>Staff</h3>
<div id="staffList"></div>
<input id="newStaffName" placeholder="Name">
<input type="color" id="newStaffColor" value="#cce5ff">
<button onclick="addStaff()">Add</button>
<br><br>
<button onclick="closeStaff()">Close</button>
</div>
</div>

<!-- CONFLICT -->
<div id="conflictModal" class="modal hidden">
<div class="modal-content">
<h3>⚠️ Time conflict</h3>
<p>This staff member is busy</p>
<button onclick="closeConflict()">OK</button>
</div>
</div>

<script type="module">
/* ===== FIREBASE ===== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
deleteDoc,
doc,
onSnapshot
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyC5BecKxYxQ9V5qbmXBNkTsvnIZBtK_dx8",
authDomain: "rosesnails-calendar.firebaseapp.com",
projectId: "rosesnails-calendar",
storageBucket: "rosesnails-calendar.firebasestorage.app",
messagingSenderId: "1000239390265",
appId: "1:1000239390265:web:d2ed45be53b233cf40f7e8"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ===== DATA ===== */
let staff = [];
let appointments = [];

/* ===== DOM ===== */
const calendar = document.getElementById('calendar');
const calendarDate = document.getElementById('calendarDate');
calendarDate.valueAsDate = new Date();
calendarDate.onchange = renderCalendar;

/* ===== TIME ===== */
function timeSlots() {
let slots = [];
for (let h=8; h<=20; h++) {
for (let m=0; m<60; m+=15) {
if (h===20 && m>0) continue;
let d = new Date();
d.setHours(h,m,0,0);
slots.push(d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}));
}
}
return slots;
}

/* ===== FIRESTORE LISTENERS ===== */
onSnapshot(collection(db,"staff"), snap=>{
staff = snap.docs.map(d=>({id:d.id,...d.data()}));
renderCalendar();
});

onSnapshot(collection(db,"appointments"), snap=>{
appointments = snap.docs.map(d=>({id:d.id,...d.data()}));
renderCalendar();
});

/* ===== CALENDAR ===== */
function renderCalendar() {
calendar.innerHTML='';
let header='<tr><th class="time">Time</th>';
staff.forEach(s=>header+=`<th>${s.name}</th>`);
header+='</tr>';
calendar.innerHTML+=header;

timeSlots().forEach(t=>{
let row=`<tr><td class="time">${t}</td>`;
staff.forEach((_,i)=>row+=`<td class="slot" data-time="${t}" data-staff="${i}"></td>`);
row+='</tr>';
calendar.innerHTML+=row;
});

drawAppointments();
}

function drawAppointments(){
document.querySelectorAll('.slot').forEach(c=>{c.innerHTML='';c.style.background='';});
appointments.filter(a=>a.date===calendarDate.value).forEach(a=>{
let si = timeSlots().indexOf(a.time);
let blocks = a.duration/15;
let staffIndex = staff.findIndex(s=>s.id===a.staffId);
for(let i=0;i<blocks;i++){
let cell=document.querySelector(`.slot[data-time="${timeSlots()[si+i]}"][data-staff="${staffIndex}"]`);
if(cell){
cell.style.background=staff[staffIndex].color;
if(i===0) cell.innerHTML=a.client;
}
}
});
}

/* ===== ACTIONS ===== */
window.openAdd = ()=>{
aDate.value = calendarDate.value;
aStaff.innerHTML = staff.map((s,i)=>`<option value="${i}">${s.name}</option>`).join('');
aTime.innerHTML = timeSlots().map(t=>`<option>${t}</option>`).join('');
appointmentModal.classList.remove('hidden');
};

window.closeAppointment = ()=>appointmentModal.classList.add('hidden');

window.saveAppointment = async ()=>{
let data={
date:calendarDate.value,
staffId:staff[aStaff.value].id,
time:aTime.value,
duration:+aDuration.value,
client:aClient.value,
note:aNote.value
};

let conflict = appointments.some(a=>{
if(a.date!==data.date||a.staffId!==data.staffId) return false;
let s1=timeSlots().indexOf(a.time);
let e1=s1+a.duration/15;
let s2=timeSlots().indexOf(data.time);
let e2=s2+data.duration/15;
return Math.max(s1,s2)<Math.min(e1,e2);
});

if(conflict){ conflictModal.classList.remove('hidden'); return; }

await addDoc(collection(db,"appointments"),data);
closeAppointment();
};

window.openStaff=()=>{
staffModal.classList.remove('hidden');
staffList.innerHTML=staff.map((s,i)=>`<div class="staff-item">${s.name}<button onclick="removeStaff(${i})">Delete</button></div>`).join('');
};

window.closeStaff=()=>staffModal.classList.add('hidden');

window.addStaff=async()=>{
if(!newStaffName.value) return;
await addDoc(collection(db,"staff"),{name:newStaffName.value,color:newStaffColor.value});
newStaffName.value='';
};

window.removeStaff=async i=>{
await deleteDoc(doc(db,"staff",staff[i].id));
};

window.closeConflict=()=>conflictModal.classList.add('hidden');

renderCalendar();
</script>

</body>
</html>
