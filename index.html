<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Календарь салона</title>
<style>
body {
font-family: Arial, sans-serif;
margin: 10px;
}
table {
border-collapse: collapse;
width: 100%;
}
th, td {
border: 1px solid #ccc;
padding: 6px;
text-align: center;
font-size: 14px;
}
th {
background: #f2f2f2;
position: sticky;
top: 0;
}
.time {
background: #fafafa;
font-weight: bold;
}
.busy {
background: #ffb3b3;
}
</style>
</head>
<body>

<h3>Календарь записей</h3>

<label>Дата:
<input type="date" id="datePicker">
</label>

<table>
<tr>
<th>Time</th>
<th>Master 1</th>
<th>Master 2</th>
<th>Master 3</th>
<th>Master 4</th>
<th>Master 5</th>
<th>Master 6</th>
<th>Master 7</th>
<th>Master 8</th>
<th>Master 9</th>
<th>Anyone</th>
</tr>

<script>
for (let h = 8; h <= 20; h++) {
for (let m = 0; m < 60; m += 15) {
let time = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
document.write('<tr>');
document.write('<td class="time">' + time + '</td>');
for (let i = 0; i < 10; i++) {
document.write('<td></td>');
}
document.write('</tr>');
}
}
</script>

</table>

</body>
</html>
