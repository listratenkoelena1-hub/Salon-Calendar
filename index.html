<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Salon Calendar</title>

<style>
body {
font-family: Arial, sans-serif;
padding: 10px;
}

header {
display: flex;
gap: 10px;
margin-bottom: 10px;
align-items: center;
}

table {
border-collapse: collapse;
width: 100%;
}

th, td {
border: 1px solid #ccc;
text-align: center;
font-size: 12px;
height: 28px;
}

th {
background: #f2f2f2;
position: sticky;
top: 0;
}

.time {
width: 80px;
background: #fafafa;
font-weight: bold;
}

.appointment {
font-size: 11px;
color: #000;
}

button {
padding: 6px 10px;
}

.modal {
display: none;
position: fixed;
inset: 0;
background: rgba(0,0,0,0.4);
justify-content: center;
align-items: center;
}

.modal-content {
background: #fff;
padding: 15px;
width: 300px;
}
</style>
</head>

<body>

<header>
<input type="date" id="currentDate">
<button onclick="openAppointment()">Add appointment</button>
<button onclick="openStaff()">Staff</button>
</header>

<table id="calendar">
<thead>
<tr id="headerRow">
<th>Time</th>
</tr>
</thead>
<tbody></tbody>
</table>

<!-- ADD APPOINTMENT -->
<div class="modal" id="appointmentModal">
<div class="modal-content">
<h3>Add appointment</h3>

<label>Start time</label>
<select id="appTime"></select><br><br>

<label>Staff</label>
<select id="appStaff"></select><br><br>

<label>Duration</label>
<select id="appDuration">
<option value="15">00:15</option>
<option value="30">00:30</option>
<option value="45">00:45</option>
<option value="60">01:00</option>
<option value="75">01:15</option>
<option value="90">01:30</option>
<option value="105">01:45</option>
<option value="120">02:00</option>
<option value="150">02:30</option>
<option value="180">03:00</option>
<option value="210">03:30</option>
</select><br><br>

<label>Client</label>
<input id="appClient"><br><br>

<label>Note</label>
<input id="appNote"><br><br>

<button onclick="saveAppointment()">Save</button>
<button onclick="closeModals()">Cancel</button>
</div>
</div>

<!-- STAFF -->
<div class="modal" id="staffModal">
<div class="modal-content">
<h3>Staff</h3>
<div id="staffList"></div>
<input id="newStaffName" placeholder="Name">
<input type="color" id="newStaffColor">
<button onclick="addStaff()">Add</button>
<br><br>
<button onclick="closeModals()">Close</button>
</div>
</div>

<script>
const TIMES = [];
for (let h = 8; h < 20; h++) {
for (let m = 0; m < 60; m += 15) {
TIMES.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);
}
}

let staff = JSON.parse(localStorage.getItem("staff")) || [
{id:1,name:"Anna",color:"#FFE4CC"}
];

let appointments = JSON.parse(localStorage.getItem("appointments")) || [];

currentDate.valueAsDate = new Date();

function buildCalendar(){
headerRow.innerHTML = "<th>Time</th>";
staff.forEach(s=>{
headerRow.innerHTML += `<th>${s.name}</th>`;
});

const body = document.querySelector("tbody");
body.innerHTML = "";

TIMES.forEach(t=>{
const tr = document.createElement("tr");
tr.innerHTML = `<td class="time">${t}</td>`;
staff.forEach(()=> tr.innerHTML += "<td></td>");
body.appendChild(tr);
});

renderAppointments();
}

function openAppointment(){
appointmentModal.style.display="flex";
appTime.innerHTML = TIMES.map(t=>`<option>${t}</option>`).join("");
appStaff.innerHTML = staff.map(s=>`<option value="${s.id}">${s.name}</option>`).join("");
}

function closeModals(){
document.querySelectorAll(".modal").forEach(m=>m.style.display="none");
}

function saveAppointment(){
const data = {
date: currentDate.value,
time: appTime.value,
staff: +appStaff.value,
duration: +appDuration.value,
client: appClient.value,
note: appNote.value
};

const startIndex = TIMES.indexOf(data.time);
const blocks = data.duration / 15;

for (let i=0;i<blocks;i++){
if (appointments.find(a =>
a.date===data.date &&
a.staff===data.staff &&
TIMES.indexOf(a.time) === startIndex+i
)) {
alert("Time conflict");
return;
}
}

appointments.push(data);
localStorage.setItem("appointments",JSON.stringify(appointments));
closeModals();
renderAppointments();
}

function renderAppointments(){
document.querySelectorAll(".appointment").forEach(e=>e.remove());

appointments
.filter(a=>a.date===currentDate.value)
.forEach(a=>{
const col = staff.findIndex(s=>s.id===a.staff)+1;
const start = TIMES.indexOf(a.time);
const blocks = a.duration / 15;

for (let i=0;i<blocks;i++){
const cell = document.querySelector("tbody").rows[start+i].cells[col];
cell.className = "appointment";
cell.style.background = staff.find(s=>s.id===a.staff).color;
cell.innerHTML = i===0 ? `<b>${a.client}</b>` : "";
}
});
}

function openStaff(){
staffModal.style.display="flex";
renderStaff();
}

function renderStaff(){
staffList.innerHTML="";
staff.forEach(s=>{
staffList.innerHTML += `
<div>
<input value="${s.name}" onchange="s.name=this.value;saveStaff()">
<input type="color" value="${s.color}" onchange="s.color=this.value;saveStaff()">
</div>`;
});
}

function addStaff(){
staff.push({id:Date.now(),name:newStaffName.value,color:newStaffColor.value});
saveStaff();
}

function saveStaff(){
localStorage.setItem("staff",JSON.stringify(staff));
buildCalendar();
}

currentDate.onchange = renderAppointments;
buildCalendar();
</script>

</body>
</html>
