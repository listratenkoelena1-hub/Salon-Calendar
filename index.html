<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Salon Calendar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial, sans-serif; margin:10px; }

/* HEADER */
header {
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
}
.header-left, .header-right {
display:flex;
gap:10px;
align-items:center;
}
header input, header button {
font-size:16px;
padding:8px 12px;
}

/* TABLE */
table { border-collapse:collapse; width:100%; table-layout:fixed; }
th {
height:38px;
font-size:13px;
font-weight:bold;
}
td {
height:26px;
font-size:11px;
}
th, td { border:1px solid #ccc; text-align:center; }
.time { width:58px; background:#fafafa; }
.slot { cursor:pointer; }

/* APPOINTMENT */
.appointment {
font-size:11px;
border-radius:4px;
color:#000;
}

/* MODALS */
.modal {
position:fixed;
inset:0;
background:rgba(0,0,0,.4);
display:flex;
align-items:center;
justify-content:center;
z-index:1000;
}
.hidden { display:none; }
.modal-content {
background:#fff;
padding:15px;
border-radius:10px;
width:320px;
}
.modal-content label {
display:block;
margin-top:8px;
font-size:12px;
}
.modal-content input,
.modal-content select,
.modal-content textarea {
width:100%;
font-size:14px;
}
.modal-buttons {
display:flex;
justify-content:flex-end;
gap:8px;
margin-top:12px;
}

/* STAFF */
.staff-row {
display:flex;
align-items:center;
gap:6px;
margin:6px 0;
}
.staff-row span { flex:1; }
</style>
</head>

<body>

<header>
<div class="header-left">
<input type="date" id="calendarDate">
<button onclick="openAdd()">Add appointment</button>
</div>
<div class="header-right">
<button onclick="openSearch()">Search</button>
<button onclick="openStaff()">Staff</button>
</div>
</header>

<table id="calendar"></table>

<!-- ADD / EDIT -->
<div id="appointmentModal" class="modal hidden">
<div class="modal-content">
<h3>Appointment</h3>

<label>Date</label>
<input type="date" id="aDate" readonly>

<label>Staff</label>
<select id="aStaff"></select>

<label>Start time</label>
<select id="aTime"></select>

<label>Duration</label>
<select id="aDuration">
<option value="15">15 min</option>
<option value="30">30 min</option>
<option value="45">45 min</option>
<option value="60">01:00</option>
<option value="75">01:15</option>
<option value="90">01:30</option>
<option value="105">01:45</option>
<option value="120">02:00</option>
<option value="150">02:30</option>
<option value="180">03:00</option>
<option value="210">03:30</option>
</select>

<label>Client</label>
<input id="aClient">

<label>Note</label>
<textarea id="aNote"></textarea>

<div class="modal-buttons">
<button onclick="saveAppointment()">Save</button>
<button onclick="deleteAppointment()">Delete</button>
<button onclick="closeAppointment()">Close</button>
</div>
</div>
</div>

<!-- STAFF -->
<div id="staffModal" class="modal hidden">
<div class="modal-content">
<h3>Staff</h3>
<div id="staffList"></div>
<hr>
<input id="newStaffName" placeholder="Name">
<input type="color" id="newStaffColor" value="#cce5ff">
<div class="modal-buttons">
<button onclick="addStaff()">Add</button>
<button onclick="closeStaff()">Close</button>
</div>
</div>
</div>

<!-- SEARCH -->
<div id="searchModal" class="modal hidden">
<div class="modal-content">
<h3>Search client</h3>
<input id="searchInput" placeholder="Client name" oninput="runSearch()">
<div id="searchResults"></div>
<div class="modal-buttons">
<button onclick="closeSearch()">Close</button>
</div>
</div>
</div>

<!-- CONFLICT -->
<div id="conflictModal" class="modal hidden">
<div class="modal-content">
<h3>⚠️ Tech busy</h3>
<p>Sorry, this staff member is busy.<br>Please choose another time.</p>
<div class="modal-buttons">
<button onclick="closeConflict()">OK</button>
</div>
</div>
</div>

<script>
let staff = [];
let appointments = [];
let editIndex = null;

const calendar = document.getElementById('calendar');
const calendarDate = document.getElementById('calendarDate');
calendarDate.valueAsDate = new Date();
calendarDate.onchange = renderCalendar;

/* TIME SLOTS */
function timeSlots(){
let slots=[];
for(let h=8;h<=20;h++){
for(let m=0;m<60;m+=15){
if(h===20 && m>0) continue;
let d=new Date();
d.setHours(h,m,0,0);
slots.push(d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}));
}
}
return slots;
}

/* CALENDAR */
function renderCalendar(){
calendar.innerHTML='';
let head='<tr><th class="time">Time</th>';
staff.forEach(s=>head+=`<th style="background:${s.color}">${s.name}</th>`);
calendar.innerHTML+=head+'</tr>';

timeSlots().forEach(t=>{
let row=`<tr><td class="time">${t}</td>`;
staff.forEach((_,i)=>row+=`<td class="slot" data-time="${t}" data-staff="${i}"></td>`);
calendar.innerHTML+=row+'</tr>';
});
drawAppointments();
}

/* DRAW */
function drawAppointments(){
document.querySelectorAll('.slot').forEach(c=>{c.innerHTML='';c.style.background='';});
appointments
.filter(a=>a.date===calendarDate.value)
.forEach((a,i)=>{
let start=timeSlots().indexOf(a.time);
let blocks=a.duration/15;
for(let b=0;b<blocks;b++){
let cell=document.querySelector(`.slot[data-time="${timeSlots()[start+b]}"][data-staff="${a.staff}"]`);
if(cell){
if(b===0) cell.innerHTML=a.client;
cell.style.background=staff[a.staff].color;
cell.onclick=()=>openEdit(i);
}
}
});
}

/* ADD / EDIT */
function openAdd(){
editIndex=null;
appointmentModal.classList.remove('hidden');
aDate.value=calendarDate.value;
fillSelects();
}
function openEdit(i){
editIndex=i;
let a=appointments[i];
openAdd();
aStaff.value=a.staff;
aTime.value=a.time;
aDuration.value=a.duration;
aClient.value=a.client;
aNote.value=a.note;
}
function closeAppointment(){ appointmentModal.classList.add('hidden'); }

function fillSelects(){
aStaff.innerHTML='';
staff.forEach((s,i)=>aStaff.innerHTML+=`<option value="${i}">${s.name}</option>`);
aTime.innerHTML='';
timeSlots().forEach(t=>aTime.innerHTML+=`<option>${t}</option>`);
}

function saveAppointment(){
let data={
date:calendarDate.value,
staff:+aStaff.value,
time:aTime.value,
duration:+aDuration.value,
client:aClient.value,
note:aNote.value
};

let conflict=appointments.some((a,i)=>{
if(i===editIndex) return false;
if(a.date!==data.date || a.staff!==data.staff) return false;
let s1=timeSlots().indexOf(a.time);
let e1=s1+a.duration/15;
let s2=timeSlots().indexOf(data.time);
let e2=s2+data.duration/15;
return Math.max(s1,s2)<Math.min(e1,e2);
});

if(conflict){ conflictModal.classList.remove('hidden'); return; }

if(editIndex!==null) appointments[editIndex]=data;
else appointments.push(data);

closeAppointment();
renderCalendar();
}

function deleteAppointment(){
if(editIndex===null) return;
if(!confirm('Delete this appointment?')) return;
appointments.splice(editIndex,1);
closeAppointment();
renderCalendar();
}

/* STAFF */
function openStaff(){ staffModal.classList.remove('hidden'); renderStaff(); }
function closeStaff(){ staffModal.classList.add('hidden'); }

function renderStaff(){
staffList.innerHTML='';
staff.forEach((s,i)=>{
staffList.innerHTML+=`
<div class="staff-row">
<button onclick="moveStaff(${i},-1)">↑</button>
<button onclick="moveStaff(${i},1)">↓</button>
<span>${s.name}</span>
<input type="color" value="${s.color}" onchange="staff[${i}].color=this.value;renderCalendar()">
<button onclick="removeStaff(${i})">Delete</button>
</div>`;
});
}

function addStaff(){
if(!newStaffName.value) return;
staff.push({name:newStaffName.value,color:newStaffColor.value});
newStaffName.value='';
renderStaff(); renderCalendar();
}

function moveStaff(i,dir){
let ni=i+dir;
if(ni<0||ni>=staff.length) return;
[staff[i],staff[ni]]=[staff[ni],staff[i]];
appointments.forEach(a=>{
if(a.staff===i) a.staff=ni;
else if(a.staff===ni) a.staff=i;
});
renderStaff(); renderCalendar();
}

function removeStaff(i){
if(!confirm('Delete this staff member and all their appointments?')) return;
staff.splice(i,1);
appointments=appointments.filter(a=>a.staff!==i)
.map(a=>({ ...a, staff: a.staff>i ? a.staff-1 : a.staff }));
renderStaff(); renderCalendar();
}

/* SEARCH */
function openSearch(){ searchModal.classList.remove('hidden'); runSearch(); }
function closeSearch(){ searchModal.classList.add('hidden'); }
function runSearch(){
let q=searchInput.value.toLowerCase();
searchResults.innerHTML='';
appointments
.filter(a=>a.client.toLowerCase().includes(q))
.forEach(a=>{
searchResults.innerHTML+=`<div>${a.date} ${a.time} – ${a.client}</div>`;
});
}

function closeConflict(){ conflictModal.classList.add('hidden'); }

renderCalendar();
</script>

</body>
</html>
