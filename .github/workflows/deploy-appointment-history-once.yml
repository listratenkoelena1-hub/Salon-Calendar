name: Deploy appointment history once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-appointment-history-once.yml'

jobs:
  deploy:
    if: github.repository == 'listratenkoelena1-hub/Salon-Calendar'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g firebase-tools

      - name: Write service account key
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-key.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy appointment history function
        working-directory: salon-functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        run: firebase deploy --only functions:getAppointmentHistory --project rosesnails-calendar --non-interactive

      - name: Deploy calendar hosting
        working-directory: salon-calendar
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        run: firebase deploy --only hosting:calendar --project rosesnails-calendar --non-interactive
