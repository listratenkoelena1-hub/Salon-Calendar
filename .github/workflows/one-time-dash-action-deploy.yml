name: One-time Dash action production deploy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-dash-action-deploy.yml'

concurrency:
  group: one-time-dash-action-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.head_commit.message == 'Deploy Dash message action to production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g firebase-tools

      - name: Write service account key
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-key.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Add to calendar callable
        working-directory: salon-functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        run: firebase deploy --only functions:addDashMonitorAppointment --project rosesnails-calendar --non-interactive

      - name: Deploy calendar interface
        working-directory: salon-calendar
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        run: firebase deploy --only hosting:calendar --project rosesnails-calendar --non-interactive
